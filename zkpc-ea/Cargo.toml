[package]
name = "zkpc-ea"
version = "0.1.0"
edition = "2021"

[dependencies]
zkpc-core = { path = "../zkpc-core" }
p256 = { version = "0.13.2", features = ["ecdsa", "arithmetic"] }
p384 = { version = "0.13.1", features = ["ecdsa", "arithmetic"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ciborium = "0.2.2"
der = "0.7.10"
x509-cert = { version = "0.2.5", features = ["pem", "builder"] }
anyhow = { workspace = true }

tracing = { workspace = true }

