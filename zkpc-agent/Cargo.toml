[package]
name = "zkpc-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
zkpc-core = { path = "../zkpc-core" }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
p256 = { version = "0.13.2", features = ["ecdsa", "arithmetic"] }
tss-esapi = { version = "8.0.0-alpha.3", path = "../external/rust-tss-esapi-d-1/tss-esapi", optional = true }


[dev-dependencies]
zkpc-ea = { path = "../zkpc-ea" }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["std"] }

[features]
tpm = ["tss-esapi"]

[[test]]
name = "tpm_integration"
required-features = ["tpm"]

[[test]]
name = "tpm_live_test"
required-features = ["tpm"]
