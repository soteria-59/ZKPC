[package]
name = "zkpc-core"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
anyhow = { workspace = true }
p256 = { version = "0.13", features = ["ecdsa", "hash2curve"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
hex = "0.4"

[dev-dependencies]
rand_core = { version = "0.6", features = ["std"] }
p256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
